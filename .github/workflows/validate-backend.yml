name: Validate DPP backend

on:
  pull_request:
  push:
    branches:
      - feature/unified-player-research

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend modules
        run: python -m py_compile main.py
